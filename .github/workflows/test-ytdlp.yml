name: YouTube Download & Diagnostics

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'כתובת ה-URL של יוטיוב להורדה'
        required: true
        type: string

jobs:
  diagnose_and_download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. System & Environment Diagnostic
        run: |
          echo "=== SYSTEM CHECK ==="
          echo "Python path: $(which python3)"
          python3 --version
          echo "Node path: $(which node)"
          node -v
          echo "NPM path: $(which npm)"
          npm -v

      - name: 2. Install/Upgrade yt-dlp & Dependencies
        run: |
          python -m pip install --upgrade pip
          # מתקין את הגרסה העדכנית ביותר יחד עם תמיכת JS מובנית
          pip install --upgrade --force-reinstall "yt-dlp[default]"
          pip install --upgrade yt-dlp-ejs

      - name: 3. Verify Cookies Secret
        run: |
          # כותב את העוגיות לקובץ ובודק שלא ריק ושפורמט הבסיס תקין
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          if [ -s cookies.txt ]; then
            echo "SUCCESS: cookies.txt created and is not empty."
            echo "File size: $(wc -c < cookies.txt) bytes"
          else
            echo "ERROR: cookies.txt is empty! Please check GitHub Secrets."
            exit 1
          fi

      - name: 4. Extract Video Info (Dry Run & Format Check)
        run: |
          # מדפיס את רשימת הפורמטים הזמינים כדי לראות מה יוטיוב מחזיר בפועל
          yt-dlp --cookies cookies.txt --list-formats "${{ github.event.inputs.youtube_url }}" || echo "WARNING: --list-formats encountered an issue, proceeding to verbose download."

      - name: 5. Download Video with Full Verbose Logs
        run: |
          # מריץ הורדה עם לוגים מלאים (-v)
          yt-dlp -v --cookies cookies.txt "${{ github.event.inputs.youtube_url }}"

      - name: 6. Upload Downloaded File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: '*.%(ext)s'
