name: Download Video to File

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'הדבק כאן את הקישור לבדיקה'
        required: true
        default: ''

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Save Cookies File
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video File (Lightweight)
        run: |
          echo "Downloading compressed video for smooth playback..."
          yt-dlp \
            --cookies cookies.txt \
            -f "best[height<=360]" \
            -o "output_video.mp4" \
            "${{ github.event.inputs.youtube_url }}"

      - name: Remove Temporary Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: output_video.mp4

      - name: Get Direct Download URL
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Fetching artifact download information..."
          ARTIFACT_URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts"
          RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$ARTIFACT_URL")
          echo "Artifact API Details:"
          echo "$RESPONSE"
