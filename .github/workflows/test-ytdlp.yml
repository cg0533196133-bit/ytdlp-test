name: Download Video to File

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'הדבק כאן את הקישור לבדיקה'
        required: true
        default: ''

jobs:
  download-video:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Install yt-dlp, Deno & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Save Cookies File
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video File (With Audio)
        run: |
          echo "Downloading video and audio..."
          yt-dlp \
            --cookies cookies.txt \
            -f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]/best[height<=480]" \
            --merge-output-format mp4 \
            -o "output_raw.%(ext)s" \
            "${{ github.event.inputs.youtube_url }}"

      - name: Fix and Re-encode Video Headers
        run: |
          echo "מתקן ובודק את מבנה הקובץ..."
          RAW_FILE=$(find . -maxdepth 1 -name "output_raw.mp4" | head -n 1)
          
          if [ -f "$RAW_FILE" ]; then
            # יצירת קובץ חדש ונקי עם כותרות תקינות לחלוטין
            ffmpeg -i "$RAW_FILE" -c copy "fixed_video.mp4"
            rm -f "$RAW_FILE"
          else
            echo "שגיאה: הקובץ הגולמי לא נמצא."
            exit 1
          fi

      - name: Remove Temporary Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Upload Video as Artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: "fixed_video.mp4"
