name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'כתובת ה-URL של יוטיוב להורדה'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (Required for n-challenge solving)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install latest yt-dlp and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --force-reinstall "yt-dlp[default]"

      - name: Create cookies file from Secrets
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download video
        run: |
          yt-dlp --cookies cookies.txt "${{ github.event.inputs.youtube_url }}"

      - name: Upload downloaded file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: '*.%(ext)s'
