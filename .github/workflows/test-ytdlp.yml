name: YouTube Download and Artifact Upload

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'כתובת ה-URL של יוטיוב להורדה'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Latest Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'latest'

      - name: Install yt-dlp and EJS packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --force-reinstall "yt-dlp[default]"
          pip install --upgrade yt-dlp-ejs

      - name: Create cookies file from Secrets
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video using Deno Runtime
        run: |
          # ההורדה מתבצעת ושומרת את הקובץ בשם המקורי של הסרטון
          yt-dlp -v --js-runtimes deno --cookies cookies.txt "${{ github.event.inputs.youtube_url }}"

      - name: Upload Downloaded File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: |
            *.mp4
            *.mkv
            *.webm
            *.m4a
            *.mp3
