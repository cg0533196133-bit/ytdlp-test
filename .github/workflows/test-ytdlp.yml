name: Download YouTube Video - Debug Mode

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'כתובת ה-URL של יוטיוב להורדה'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (Required for challenge solving)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug Environment Info
        run: |
          echo "=== Python Version ==="
          python3 --version
          echo "=== Node Version ==="
          node -v
          echo "=== Pip Packages ==="
          pip list

      - name: Install latest yt-dlp and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --force-reinstall "yt-dlp[default]"

      - name: Create cookies file from Secrets
        run: |
          # יוצר את הקובץ ומוודא שנוצר בהצלחה
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          if [ -s cookies.txt ]; then
            echo "Cookies file created successfully (size > 0)."
          else
            echo "WARNING: Cookies file is empty! Check your GitHub Secret."
          fi

      - name: Download video with verbose logging
        run: |
          # הדגל -v (verbose) יגרום ל-yt-dlp להדפיס בדיוק מה הבעיה אם תהיה שגיאה
          yt-dlp -v --cookies cookies.txt "${{ github.event.inputs.youtube_url }}"

      - name: Upload downloaded file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: '*.%(ext)s'
