name: YouTube Download & Diagnostics

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'כתובת ה-URL של יוטיוב להורדה'
        required: true
        type: string

jobs:
  diagnose_and_download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node and PATH
        run: |
          echo "=== NODE PATH & VERSION ==="
          which node
          node -v
          # מוודא שהנתיב של Node זמין באופן גלובלי למערכת
          export PATH=$PATH

      - name: Install yt-dlp and JavaScript support packages
        run: |
          python -m pip install --upgrade pip
          # מתקין yt-dlp יחד עם חבילות עזר שפתרו בעיות פתרון אתגרים (EJS)
          pip install --upgrade --force-reinstall "yt-dlp[default]"
          pip install --upgrade yt-dlp-ejs

      - name: Verify Cookies Secret
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          if [ -s cookies.txt ]; then
            echo "SUCCESS: cookies.txt created."
          else
            echo "ERROR: cookies.txt is empty!"
            exit 1
          fi

      - name: Download Video with Verbose Logs
        run: |
          # מריץ את ההורדה
          yt-dlp -v --cookies cookies.txt "${{ github.event.inputs.youtube_url }}"

      - name: Upload Downloaded File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: '*.%(ext)s'
