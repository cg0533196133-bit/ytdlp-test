name: Download Video to File

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'הדבק כאן את הקישור לבדיקה'
        required: true
        default: ''

jobs:
  download-video:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Install yt-dlp, Deno & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Save Cookies File
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video File (With Audio)
        run: |
          echo "Downloading video and audio..."
          yt-dlp \
            --cookies cookies.txt \
            -f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]/best[height<=480]" \
            --merge-output-format mp4 \
            -o "%(title)s.%(ext)s" \
            "${{ github.event.inputs.youtube_url }}"

      - name: Remove Temporary Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Upload Video as Artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: "*.mp4"

      - name: Print Direct Download Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          
          echo "שולף את פרטי הארטיפקט..."
          # שליפת הקישור הישיר להורדת הארטיפקט דרך ה-API של גיטהאב
          DOWNLOAD_URL=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "downloaded-video") | .archive_download_url')
          
          echo "=========================================="
          echo "כתובת ההורדה הישירה (דורשת הזדהות בגיטהאב):"
          echo "$DOWNLOAD_URL"
          echo "=========================================="
