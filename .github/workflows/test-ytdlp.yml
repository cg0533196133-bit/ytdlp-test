name: Download Video to File

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'הדבק כאן את הקישור לבדיקה'
        required: true
        default: ''

jobs:
  download-video:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Install FFmpeg, Python & Latest yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl python3-pip
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Save Cookies File
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video File (With Audio)
        run: |
          echo "Downloading video (handling shorts/formats)..."
          # פקודה שמתמודדת עם סרטונים קצרים ופורמטים מיוחדים
          yt-dlp \
            --cookies cookies.txt \
            -f "bv*+ba/b" \
            --merge-output-format mp4 \
            -o "video.%(ext)s" \
            "${{ github.event.inputs.youtube_url }}"

      - name: Remove Temporary Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: "video.mp4"
